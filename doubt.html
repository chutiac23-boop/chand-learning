<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Doubt Submission | Chand Learning</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fc;
      color: #17243b;
    }

    header {
      background: #102d59;
      color: white;
      padding: 18px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    header a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    main {
      max-width: 720px;
      margin: 40px auto;
      padding: 0 16px;
    }

    .panel {
      background: white;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 5px 25px rgba(0,0,0,.07);
    }

    h1 { margin-top: 0; }

    .intro {
      color: #64748b;
      line-height: 1.6;
    }

    label {
      display: block;
      margin: 20px 0 8px;
      font-weight: bold;
    }

    select, textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font: inherit;
      background: white;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    button {
      margin-top: 22px;
      padding: 14px 22px;
      width: 100%;
      border: 0;
      border-radius: 8px;
      background: #1558b0;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .back {
      display: inline-block;
      margin-top: 20px;
      color: #1558b0;
      text-decoration: none;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #64748b;
    }
  </style>
</head>

<body>

  <header>
    <a href="index.html">Chand Learning</a>
    <a href="index.html">Back to Home</a>
  </header>

  <main>
    <section class="panel">
      <h1>Private Doubt Submission</h1>

      <p class="intro">
        Submit your academic doubt. It will be routed to the
        teacher assigned to your selected class and subject.
      </p>

      <form id="doubtForm">

        <label for="classSelect">Select Class</label>
        <select id="classSelect" required>
          <option value="">Loading classes...</option>
        </select>

        <label for="subjectSelect">Select Subject</label>
        <select id="subjectSelect" required>
          <option value="">Loading subjects...</option>
        </select>

        <label for="doubtText">Write Your Doubt</label>
        <textarea
          id="doubtText"
          placeholder="Explain your question or difficulty here..."
          maxlength="5000"
          required
        ></textarea>

        <button id="submitButton" type="submit">
          Submit Doubt
        </button>

        <div id="message" role="status" aria-live="polite"></div>
      </form>

      <a class="back" href="index.html">← Back to Homepage</a>
    </section>
  </main>

  <footer>
    © 2026 Chand Learning
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>

  <script>
    const form = document.getElementById("doubtForm");
    const classSelect = document.getElementById("classSelect");
    const subjectSelect = document.getElementById("subjectSelect");
    const doubtText = document.getElementById("doubtText");
    const submitButton = document.getElementById("submitButton");
    const message = document.getElementById("message");

    function showMessage(text, success = false) {
      message.textContent = text;
      message.style.color = success ? "#147a3d" : "#c0392b";
    }

    async function loadOptions() {
      try {
        const { data: authData, error: authError } =
          await chandSupabase.auth.getUser();

        if (authError) throw authError;

        if (!authData.user) {
          showMessage("Please log in before submitting a doubt.");
          submitButton.disabled = true;
          return;
        }

        const { data: classes, error: classError } =
          await chandSupabase
            .from("classes")
            .select("id, name")
            .order("name");

        if (classError) throw classError;

        const { data: subjects, error: subjectError } =
          await chandSupabase
            .from("subjects")
            .select("id, name")
            .order("name");

        if (subjectError) throw subjectError;

        classSelect.innerHTML =
          '<option value="">Choose your class</option>';

        subjectSelect.innerHTML =
          '<option value="">Choose your subject</option>';

        (classes || []).forEach(item => {
          const option = document.createElement("option");
          option.value = item.id;
          option.textContent = item.name;
          classSelect.appendChild(option);
        });

        (subjects || []).forEach(item => {
          const option = document.createElement("option");
          option.value = item.id;
          option.textContent = item.name;
          subjectSelect.appendChild(option);
        });

        if (!classes || classes.length === 0) {
          showMessage("No classes have been added yet.");
        } else if (!subjects || subjects.length === 0) {
          showMessage("No subjects have been added yet.");
        }

      } catch (error) {
        showMessage("Could not load the form: " + error.message);
        submitButton.disabled = true;
      }
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      submitButton.disabled = true;
      submitButton.textContent = "Submitting...";
      showMessage("");

      try {
        const { data: authData, error: authError } =
          await chandSupabase.auth.getUser();

        if (authError) throw authError;

        const user = authData.user;

        if (!user) {
          throw new Error("Please log in before submitting a doubt.");
        }

        const classId = classSelect.value;
        const subjectId = subjectSelect.value;
        const text = doubtText.value.trim();

        if (!classId || !subjectId || !text) {
          throw new Error("Please complete all fields.");
        }

        // Find the teacher assigned to this exact class and subject.
        const { data: assignment, error: assignmentError } =
          await chandSupabase
            .from("teacher_assignments")
            .select("teacher_id")
            .eq("class_id", classId)
            .eq("subject_id", subjectId)
            .maybeSingle();

        if (assignmentError) throw assignmentError;

        if (!assignment) {
          throw new Error(
            "No teacher is currently assigned to this class and subject. Please contact the administrator."
          );
        }

        // Submit the doubt without requesting the inserted row back.
        const { error: insertError } =
          await chandSupabase
            .from("student_doubts")
            .insert({
              student_id: user.id,
              class_id: classId,
              subject_id: subjectId,
              teacher_id: assignment.teacher_id,
              doubt_text: text,
              status: "pending"
            });

        if (insertError) throw insertError;

        form.reset();
        showMessage(
          "Your doubt has been submitted successfully!",
          true
        );

      } catch (error) {
        showMessage("Submission failed: " + error.message);
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Submit Doubt";
      }
    });

    loadOptions();
  </script>

</body>
</html>
